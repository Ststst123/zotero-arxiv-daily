name: Test
on:
  workflow_dispatch:

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      #  with:
      #    repository: ${{ vars.REPOSITORY }}
      #    ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4


      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          export DEBUG=true
          if [ -n "$CUSTOM_CONFIG" ]; then
            CUSTOM_CONFIG_CONTENT="$CUSTOM_CONFIG" python - <<'PY' > config/custom.yaml
import os
import re

content = os.environ["CUSTOM_CONFIG_CONTENT"]
pattern = re.compile(r"\$\{oc\.env:([^,}]+)\}")

def replace_if_invalid_env_name(match):
    env_name = match.group(1).strip()
    if re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", env_name):
        return match.group(0)
    return env_name

print(pattern.sub(replace_if_invalid_env_name, content), end="")
PY
          fi
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py
